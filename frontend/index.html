 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">💰 Expense Tracker</span>
    </div>
  </nav>

  <div class="container">

    <!-- Alert for errors -->
    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

    <!-- Summary cards -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h6 class="card-subtitle text-muted mb-2">Total</h6>
            <h3 id="totalAmount">$0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h6 class="card-subtitle text-muted mb-2">Number of expenses</h6>
            <h3 id="totalCount">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h6 class="card-subtitle text-muted mb-2">Highest expense</h6>
            <h3 id="highestExpense">$0</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Add expense form -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Add an expense</h5>
        <form id="expenseForm" novalidate>
          <div class="row g-2">
            <div class="col-md-3">
              <input type="text" class="form-control" id="title" placeholder="Title" />
              <div class="invalid-feedback">Title is required.</div>
            </div>
            <div class="col-md-2">
              <input type="number" step="0.01" class="form-control" id="amount" placeholder="Amount" />
              <div class="invalid-feedback">Amount must be greater than 0.</div>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="category">
                <option value="">Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback">Please choose a category.</div>
            </div>
            <div class="col-md-2">
              <input type="date" class="form-control" id="date" />
              <div class="invalid-feedback">Date is required.</div>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary w-100">Add</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Filter -->
    <div class="mb-3">
      <label class="form-label">Filter by category</label>
      <select class="form-select w-auto" id="categoryFilter">
        <option value="All">All</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Bills">Bills</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <!-- Spinner -->
    <div id="spinner" class="text-center my-4 d-none">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <!-- Table -->
    <table class="table table-striped shadow-sm bg-white">
      <thead>
        <tr>
          <th>Title</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Date</th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="expensesTableBody"></tbody>
    </table>

  </div>

  <!-- Edit modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editForm" novalidate>
            <input type="hidden" id="editId" />
            <div class="mb-2">
              <label class="form-label">Title</label>
              <input type="text" class="form-control" id="editTitle" />
            </div>
            <div class="mb-2">
              <label class="form-label">Amount</label>
              <input type="number" step="0.01" class="form-control" id="editAmount" />
            </div>
            <div class="mb-2">
              <label class="form-label">Category</label>
              <select class="form-select" id="editCategory">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="editDate" />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveEditBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
